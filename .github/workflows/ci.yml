name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer le projet et ses dépendances de développement
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check marastat tests outils

      - name: Tests
        run: python -m pytest -q

      # Le test de bout en bout couvre déjà la chaîne, mais l'exécuter en
      # ligne de commande vérifie aussi le point d'entrée et les options,
      # c'est-à-dire exactement ce que tape l'utilisateur.
      - name: Chaîne complète sur le jeu de démonstration
        run: |
          python outils/generer_demo.py
          python -m marastat --factures exemples/factures --sortie exemples/rapport --sans-ouverture --sans-notification

      - name: Publier le rapport de démonstration
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demonstration
          path: exemples/rapport/rapport.html
