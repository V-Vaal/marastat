[project]
name = "marastat"
version = "1.0.0"
description = "Des factures PDF au rapport de ventes, sans ressaisie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Valentin Valluet" }]
keywords = ["pdf", "facture", "etl", "sqlite", "rapport", "maraichage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Natural Language :: French",
]
dependencies = ["pdfplumber==0.11.10"]

[project.optional-dependencies]
# Uniquement pour fabriquer le jeu de factures de demonstration et lancer la
# suite de tests. L'outil lui-meme n'a besoin que de pdfplumber.
dev = [
    "pytest==8.4.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "reportlab>=4.0",
    "ruff>=0.6",
]

[project.urls]
Source = "https://github.com/V-Vaal/marastat"

[project.scripts]
marastat = "marastat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marastat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FURB", "RUF"]

[tool.mypy]
# Le perimetre est le code livre. Les tests et les outils restent souples :
# y exiger des annotations completes couterait plus qu'il ne rapporterait.
files = ["marastat"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# pdfplumber ne publie pas de stubs.
module = "pdfplumber.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["marastat"]

[tool.coverage.report]
# Le seuil n'est pas un objectif a atteindre mais un cliquet : il constate le
# niveau actuel et empeche de le perdre sans s'en rendre compte.
fail_under = 85
show_missing = true
